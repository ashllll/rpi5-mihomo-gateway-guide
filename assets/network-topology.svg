<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi 5 Mihomo 历史网络拓扑（2026-07）</title>
  <desc id="desc">主路由位于 192.168.100.0/24 上游网络，Raspberry Pi 5 通过 wan0 接入主路由，通过 lan0 为 192.168.1.0/24 下游网络提供 DHCP、DNS、NAT 和 Mihomo 透明代理。wlan0 是应急管理通道。独立 AP rp5 和下游设备位于树莓派 LAN 一侧。连接主路由 Wi-Fi 的设备绕过树莓派。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF4FA"/>
    </linearGradient>
    <linearGradient id="piFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#D97706"/>
    </marker>
    <style>
      text {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        fill: #1E293B;
      }
      .title { font-size: 38px; font-weight: 750; letter-spacing: -0.8px; }
      .subtitle { font-size: 17px; fill: #475569; }
      .panel-title { font-size: 20px; font-weight: 700; }
      .panel-caption { font-size: 13px; fill: #64748B; }
      .node-title { font-size: 18px; font-weight: 700; }
      .node-subtitle { font-size: 14px; fill: #475569; }
      .small { font-size: 12px; fill: #64748B; }
      .tiny { font-size: 11px; fill: #64748B; }
      .mono {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .badge { font-size: 11px; font-weight: 650; }
      .line-label { font-size: 12px; font-weight: 650; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.4; }
      .soft-card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.2; }
      .blue-card { fill: #EFF6FF; stroke: #93C5FD; stroke-width: 1.4; }
      .green-card { fill: #ECFDF5; stroke: #6EE7B7; stroke-width: 1.4; }
      .purple-card { fill: #F5F3FF; stroke: #C4B5FD; stroke-width: 1.4; }
      .amber-card { fill: #FFFBEB; stroke: #FCD34D; stroke-width: 1.4; }
      .data-line { fill: none; stroke: #2563EB; stroke-width: 4; stroke-linecap: round; }
      .direct-line { fill: none; stroke: #059669; stroke-width: 3.2; stroke-linecap: round; }
      .mgmt-line { fill: none; stroke: #D97706; stroke-width: 3; stroke-dasharray: 10 8; stroke-linecap: round; }
      .muted-line { fill: none; stroke: #94A3B8; stroke-width: 2.2; stroke-linecap: round; }
      .inner-line { fill: none; stroke: #64748B; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#bg)"/>

  <!-- Header -->
  <text x="60" y="68" class="title">Raspberry Pi 5 + Mihomo 实际网络拓扑</text>
  <text x="60" y="98" class="subtitle">双网口透明代理网关 · 物理链路、管理通道、DNS/NAT 与自动恢复路径</text>
  <g transform="translate(1480 45)">
    <rect width="260" height="48" rx="24" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="27" cy="24" r="7" fill="#10B981"/>
    <text x="45" y="29" class="node-subtitle">归档快照 · 2026-07-24</text>
  </g>

  <!-- Panels -->
  <g aria-label="物理网络拓扑">
    <rect x="50" y="130" width="1040" height="920" rx="28" fill="#FFFFFF" fill-opacity="0.72" stroke="#D9E2EC"/>
    <text x="82" y="172" class="panel-title">01 · 物理网络与真实流量路径</text>
    <text x="82" y="196" class="panel-caption">蓝色实线：经树莓派的数据路径　橙色虚线：应急管理路径　灰色：绕过树莓派</text>

    <!-- Internet cloud -->
    <g transform="translate(385 220)" filter="url(#softShadow)">
      <path d="M84 68h205c30 0 54-21 54-48 0-24-19-44-44-47-9-35-42-61-82-61-34 0-64 19-77 48-10-6-22-9-35-9-34 0-62 24-64 55C17 11 0 30 0 54c0 31 25 56 56 56h28z"
            transform="translate(0 48)" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
      <circle cx="168" cy="130" r="27" fill="#DBEAFE"/>
      <path d="M155 130h26M168 117v26" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
      <text x="171" y="102" text-anchor="middle" class="node-title">Internet</text>
      <text x="171" y="188" text-anchor="middle" class="node-subtitle">运营商公网 / 海外服务 / CDN</text>
    </g>

    <!-- Internet to router -->
    <path d="M556 408 V454" class="data-line" marker-end="url(#arrowBlue)"/>
    <rect x="583" y="421" width="112" height="26" rx="13" fill="#DBEAFE"/>
    <text x="639" y="439" text-anchor="middle" class="line-label" fill="#1D4ED8">上游公网</text>

    <!-- Main Router -->
    <g transform="translate(305 466)" filter="url(#shadow)">
      <rect width="500" height="155" rx="22" class="card"/>
      <rect x="0" y="0" width="10" height="155" rx="5" fill="#2563EB"/>
      <!-- router icon -->
      <g transform="translate(30 39)" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="32" width="64" height="38" rx="8"/>
        <path d="M16 32V18M48 32V18M8 18c4-7 12-11 20-11M56 18C52 11 44 7 36 7"/>
        <circle cx="18" cy="51" r="3" fill="#2563EB" stroke="none"/>
        <circle cx="31" cy="51" r="3" fill="#10B981" stroke="none"/>
      </g>
      <text x="120" y="43" class="node-title">主路由</text>
      <text x="120" y="70" class="mono">网关 192.168.100.1/24</text>
      <text x="120" y="96" class="node-subtitle">保留上游 DHCP · 保留主 Wi-Fi · 千兆 LAN</text>
      <g transform="translate(120 113)">
        <rect width="108" height="25" rx="12.5" fill="#DBEAFE"/>
        <text x="54" y="17" text-anchor="middle" class="badge" fill="#1D4ED8">UPSTREAM</text>
        <rect x="118" width="116" height="25" rx="12.5" fill="#F1F5F9"/>
        <text x="176" y="17" text-anchor="middle" class="badge">DHCP ON</text>
      </g>
    </g>

    <!-- Router Wi-Fi bypass clients -->
    <g transform="translate(837 446)">
      <rect width="218" height="195" rx="20" class="soft-card"/>
      <g transform="translate(20 23)" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round">
        <path d="M0 14c20-19 50-19 70 0M11 27c14-12 34-12 48 0M25 40c6-5 14-5 20 0"/>
        <circle cx="35" cy="51" r="3.8" fill="#64748B" stroke="none"/>
      </g>
      <text x="20" y="96" class="node-title">主路由 Wi-Fi</text>
      <text x="20" y="120" class="node-subtitle">直接使用上游网络</text>
      <rect x="20" y="139" width="178" height="34" rx="10" fill="#F1F5F9"/>
      <text x="109" y="153" text-anchor="middle" class="small">不经过树莓派</text>
      <text x="109" y="168" text-anchor="middle" class="small">例如此前测试中的 iPad</text>
    </g>
    <path d="M805 525 C820 525 824 525 837 525" class="muted-line"/>

    <!-- Router to Pi data and management -->
    <path d="M490 621 V666" class="data-line" marker-end="url(#arrowBlue)"/>
    <rect x="282" y="632" width="190" height="27" rx="13.5" fill="#DBEAFE"/>
    <text x="377" y="650" text-anchor="middle" class="line-label" fill="#1D4ED8">Ethernet · 1Gbps</text>
    <path d="M698 621 C760 646 760 684 712 710" class="mgmt-line" marker-end="url(#arrowAmber)"/>
    <rect x="750" y="640" width="172" height="45" rx="12" fill="#FFFBEB" stroke="#FCD34D"/>
    <text x="836" y="658" text-anchor="middle" class="line-label" fill="#92400E">管理 Wi-Fi</text>
    <text x="836" y="675" text-anchor="middle" class="tiny">SSH / 故障回滚</text>

    <!-- Raspberry Pi physical card -->
    <g transform="translate(290 678)" filter="url(#shadow)">
      <rect width="530" height="185" rx="24" fill="url(#piFill)" stroke="#A5B4FC" stroke-width="1.6"/>
      <rect x="0" y="0" width="10" height="185" rx="5" fill="#7C3AED"/>
      <!-- Pi icon -->
      <g transform="translate(27 32)" fill="none" stroke="#7C3AED" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0" y="0" width="78" height="78" rx="13"/>
        <rect x="20" y="17" width="38" height="38" rx="7"/>
        <path d="M9 13H0M9 30H0M9 47H0M9 64H0M78 13h9M78 30h9M78 47h9M78 64h9"/>
        <circle cx="16" cy="65" r="4" fill="#10B981" stroke="none"/>
      </g>
      <text x="130" y="38" class="node-title">Raspberry Pi 5 · Debian 13</text>
      <text x="130" y="64" class="node-subtitle">Mihomo v1.19.28 · dnsmasq · nftables · systemd</text>
      <g transform="translate(130 82)">
        <rect width="360" height="30" rx="10" class="blue-card"/>
        <text x="12" y="20" class="mono">wan0  192.168.100.x DHCP · 1Gbps</text>
        <rect y="38" width="360" height="30" rx="10" class="amber-card"/>
        <text x="12" y="58" class="mono">wlan0 192.168.100.x DHCP · 管理专用</text>
        <rect y="76" width="360" height="30" rx="10" class="purple-card"/>
        <text x="12" y="96" class="mono">lan0  192.168.1.1/24 · 2.5Gbps</text>
      </g>
    </g>

    <!-- Pi to AP -->
    <path d="M555 863 V902" class="data-line" marker-end="url(#arrowBlue)"/>
    <rect x="580" y="871" width="172" height="27" rx="13.5" fill="#EDE9FE"/>
    <text x="666" y="889" text-anchor="middle" class="line-label" fill="#6D28D9">LAN · 2.5Gbps</text>

    <!-- AP -->
    <g transform="translate(355 914)" filter="url(#softShadow)">
      <rect width="400" height="96" rx="20" class="card"/>
      <g transform="translate(24 23)" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round">
        <path d="M0 13c17-16 43-16 60 0M10 25c12-10 28-10 40 0M23 37c4-4 10-4 14 0"/>
        <circle cx="30" cy="47" r="3.5" fill="#7C3AED" stroke="none"/>
      </g>
      <text x="108" y="37" class="node-title">交换机 / 独立 AP「rp5」</text>
      <text x="108" y="63" class="node-subtitle">AP/桥接模式 · DHCP OFF · 下游 Wi-Fi</text>
      <rect x="108" y="71" width="190" height="18" rx="9" fill="#ECFDF5"/>
      <text x="203" y="84" text-anchor="middle" class="tiny" fill="#047857">5GHz · Wi-Fi 6 · 80MHz</text>
    </g>

    <!-- Clients -->
    <path d="M555 1010 V1022" class="data-line"/>
    <path d="M238 1022 H871" class="data-line"/>
    <path d="M238 1022 V1035M450 1022V1035M660 1022V1035M871 1022V1035" class="data-line"/>
    <g transform="translate(146 1035)">
      <rect width="184" height="54" rx="14" class="soft-card"/>
      <text x="92" y="23" text-anchor="middle" class="node-subtitle" font-weight="650">Mac / PC</text>
      <text x="92" y="41" text-anchor="middle" class="tiny">关闭本机代理验收</text>
    </g>
    <g transform="translate(358 1035)">
      <rect width="184" height="54" rx="14" class="soft-card"/>
      <text x="92" y="23" text-anchor="middle" class="node-subtitle" font-weight="650">iPad / 手机</text>
      <text x="92" y="41" text-anchor="middle" class="tiny">192.168.1.0/24</text>
    </g>
    <g transform="translate(568 1035)">
      <rect width="184" height="54" rx="14" class="soft-card"/>
      <text x="92" y="23" text-anchor="middle" class="node-subtitle" font-weight="650">电视 / IoT</text>
      <text x="92" y="41" text-anchor="middle" class="tiny">透明代理或直连</text>
    </g>
    <g transform="translate(779 1035)">
      <rect width="184" height="54" rx="14" class="soft-card"/>
      <text x="92" y="23" text-anchor="middle" class="node-subtitle" font-weight="650">NAS / 其他设备</text>
      <text x="92" y="41" text-anchor="middle" class="tiny">DHCP 由树莓派提供</text>
    </g>
  </g>

  <!-- Logical services panel -->
  <g aria-label="树莓派内部逻辑链路">
    <rect x="1120" y="130" width="630" height="920" rx="28" fill="#FFFFFF" fill-opacity="0.88" stroke="#D9E2EC"/>
    <text x="1152" y="172" class="panel-title">02 · 树莓派内部逻辑链路</text>
    <text x="1152" y="196" class="panel-caption">LAN 流量如何经过 DHCP、DNS、透明代理、策略组与故障回退</text>

    <!-- Ingress -->
    <g transform="translate(1170 225)">
      <rect width="530" height="72" rx="18" class="purple-card"/>
      <circle cx="40" cy="36" r="18" fill="#7C3AED"/>
      <path d="M31 36h18M43 28l8 8-8 8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="75" y="30" class="node-title">LAN 入口 · lan0</text>
      <text x="75" y="53" class="node-subtitle">192.168.1.1/24 · 仅接管下游接口</text>
    </g>
    <path d="M1435 297 V326" class="data-line" marker-end="url(#arrowBlue)"/>

    <!-- DHCP DNS -->
    <g transform="translate(1170 338)">
      <rect width="255" height="116" rx="18" class="blue-card"/>
      <text x="22" y="30" class="node-title">dnsmasq</text>
      <text x="22" y="54" class="node-subtitle">DHCP + LAN DNS 前端</text>
      <text x="22" y="77" class="mono">GW / DNS 192.168.1.1</text>
      <text x="22" y="98" class="small">租约：192.168.1.100–199</text>
    </g>
    <g transform="translate(1445 338)">
      <rect width="255" height="116" rx="18" class="purple-card"/>
      <text x="22" y="30" class="node-title">Mihomo DNS</text>
      <text x="22" y="54" class="node-subtitle">本机上游与规则解析</text>
      <text x="22" y="77" class="mono">127.0.0.1:1053</text>
      <text x="22" y="98" class="small">DNS hijack：TCP / UDP 53</text>
    </g>
    <path d="M1425 396 H1445" class="data-line" marker-end="url(#arrowBlue)"/>
    <text x="1435" y="386" text-anchor="middle" class="tiny">正常</text>

    <!-- TUN and policies -->
    <path d="M1435 454 V485" class="data-line" marker-end="url(#arrowBlue)"/>
    <g transform="translate(1170 497)">
      <rect width="530" height="110" rx="18" class="purple-card"/>
      <text x="24" y="32" class="node-title">Mihomo TUN · mixed stack</text>
      <text x="24" y="57" class="node-subtitle">auto-route · auto-redirect · strict-route</text>
      <g transform="translate(24 74)">
        <rect width="122" height="24" rx="12" fill="#EDE9FE"/>
        <text x="61" y="17" text-anchor="middle" class="badge" fill="#6D28D9">include lan0</text>
        <rect x="156" width="150" height="24" rx="12" fill="#EDE9FE"/>
        <text x="231" y="17" text-anchor="middle" class="badge" fill="#6D28D9">private network bypass</text>
      </g>
    </g>
    <path d="M1435 607 V638" class="data-line" marker-end="url(#arrowBlue)"/>

    <g transform="translate(1170 650)">
      <rect width="530" height="180" rx="18" class="soft-card"/>
      <text x="22" y="30" class="node-title">按业务分流</text>
      <g transform="translate(22 48)">
        <rect width="151" height="42" rx="12" class="green-card"/>
        <text x="75.5" y="18" text-anchor="middle" class="badge" fill="#047857">DIRECT</text>
        <text x="75.5" y="34" text-anchor="middle" class="tiny">中国 / 游戏 / Steam</text>

        <rect x="166" width="151" height="42" rx="12" class="blue-card"/>
        <text x="241.5" y="18" text-anchor="middle" class="badge" fill="#1D4ED8">Developer</text>
        <text x="241.5" y="34" text-anchor="middle" class="tiny">GitHub / 开发服务</text>

        <rect x="332" width="154" height="42" rx="12" class="purple-card"/>
        <text x="409" y="18" text-anchor="middle" class="badge" fill="#6D28D9">Streaming</text>
        <text x="409" y="34" text-anchor="middle" class="tiny">YouTube / 流媒体</text>

        <rect y="56" width="151" height="42" rx="12" class="purple-card"/>
        <text x="75.5" y="74" text-anchor="middle" class="badge" fill="#6D28D9">Research + AI</text>
        <text x="75.5" y="90" text-anchor="middle" class="tiny">固定地区与出口</text>

        <rect x="166" y="56" width="151" height="42" rx="12" class="amber-card"/>
        <text x="241.5" y="74" text-anchor="middle" class="badge" fill="#92400E">Download</text>
        <text x="241.5" y="90" text-anchor="middle" class="tiny">BWB / InfraAPI / DIRECT</text>

        <rect x="332" y="56" width="154" height="42" rx="12" class="blue-card"/>
        <text x="409" y="74" text-anchor="middle" class="badge" fill="#1D4ED8">Default Proxy</text>
        <text x="409" y="90" text-anchor="middle" class="tiny">其他海外流量</text>
      </g>
      <text x="22" y="164" class="small">当前：104 节点 · 19 组 · 约 1200 条规则 · 6 个规则集</text>
    </g>

    <!-- Egress -->
    <path d="M1435 830 V845" class="data-line" marker-end="url(#arrowBlue)"/>
    <g transform="translate(1170 857)">
      <rect width="530" height="68" rx="18" class="blue-card"/>
      <circle cx="40" cy="34" r="18" fill="#2563EB"/>
      <path d="M31 34h18M43 26l8 8-8 8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="75" y="28" class="node-title">WAN 出口 · wan0</text>
      <text x="75" y="50" class="node-subtitle">基础 NAT + 上游主路由 192.168.100.1</text>
    </g>

    <!-- Recovery strip -->
    <g transform="translate(1170 945)">
      <rect width="530" height="75" rx="18" class="green-card"/>
      <text x="22" y="28" class="node-title" fill="#047857">故障回退与自动恢复</text>
      <text x="22" y="51" class="small">Mihomo 停止 → DNS 切直连；2 分钟健康检查 → 组测试 / 重载 / 重启</text>
      <text x="22" y="68" class="tiny">订阅与规则：验证 → 原子替换 → 业务探测 → 失败自动回滚</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(1125 1065)">
    <path d="M0 12 H44" class="data-line" marker-end="url(#arrowBlue)"/>
    <text x="58" y="17" class="small">代理/数据路径</text>
    <path d="M175 12 H219" class="direct-line" marker-end="url(#arrowGreen)"/>
    <text x="233" y="17" class="small">直连/回退</text>
    <path d="M343 12 H387" class="mgmt-line" marker-end="url(#arrowAmber)"/>
    <text x="401" y="17" class="small">管理通道</text>
  </g>
</svg>
