<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="topologyTitle topologyDesc">
  <title id="topologyTitle">rp5 网关数据面：四个接口、三层 DNS、预算包装器与六个 drop-in</title>
  <desc id="topologyDesc">2026-10-25 真机记录。一根网线接 UCG 交换机：VLAN1 上的 wan0 192.168.0.117/24（上游与管理入口）、同一根线上的 802.1Q VLAN20 proxy20 192.168.20.1/24（UCG 广播的 RP5-PC-TEST Wi-Fi 客户端，dnsmasq-vlan-pilot 提供 DHCP/DNS）、UCG 链路 wg-ucg-pilot 10.253.254.1/30；DNS 由 dnsmasq 环回作用域接 MosDNS、VLAN20 作用域直投 Mihomo fake-IP；Mihomo 由预算包装器启动，数据面由 inet mihomo、inet rp_filter、ip rp_nat 与 ip rule 9000 组成，出口为 wan0 192.168.0.117/24。图中不含节点、订阅与密钥。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F8F84"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CBF16D"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #E7EFE8; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .muted { fill: #98A69B; }
      .title { font-size: 28px; font-weight: 700; letter-spacing: .5px; }
      .subtitle { font-size: 14px; }
      .panel-title { font-size: 15px; font-weight: 700; fill: #CBF16D; }
      .box-title { font-size: 14px; font-weight: 600; }
      .box-line { font-size: 12px; }
      .chip { font-size: 11.5px; }
      .foot { font-size: 12.5px; }
      .flow { stroke: #7F8F84; stroke-width: 1.5; fill: none; }
      .flow-accent { stroke: #CBF16D; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#0F1311"/>
  <text class="title" x="48" y="52">rp5 网关：四网段 · 三层 DNS · 预算包装器</text>
  <text class="subtitle muted" x="48" y="80">2026-10-25 真机状态（Debian 13 / aarch64）。图只画结构与路径，不含节点、订阅、密钥与真实 MAC。</text>

  <!-- downstream -->
  <text x="40" y="128" class="panel-title">链路与对端（一根网线接 UCG）</text>

  <rect x="40" y="144" width="212" height="96" rx="10" fill="#161D19" stroke="#2C3730"/>
  <text x="56" y="170" class="box-title">同一条线 · 802.1Q</text>
  <text x="56" y="194" class="box-line mono muted">VLAN1 · 192.168.0.117/24</text>
  <text x="56" y="214" class="box-line mono muted">VLAN20 · 192.168.20.1/24</text>
  <text x="56" y="232" class="box-line muted">对端：UCG 交换机</text>

  <rect x="40" y="256" width="212" height="96" rx="10" fill="#161D19" stroke="#2C3730"/>
  <text x="56" y="282" class="box-title">RP5-PC-TEST · Wi-Fi</text>
  <text x="56" y="306" class="box-line muted">UCG 广播，VLAN20 接入</text>
  <text x="56" y="326" class="box-line muted">dnsmasq-vlan-pilot 发 DHCP/DNS</text>
  <text x="56" y="344" class="box-line muted">租约 12h · 静态租约 .10</text>

  <rect x="40" y="368" width="212" height="96" rx="10" fill="#161D19" stroke="#2C3730"/>
  <text x="56" y="394" class="box-title">UCG 链路 · wg-ucg-pilot</text>
  <text x="56" y="418" class="box-line mono muted">10.253.254.1/30 · udp/51891</text>
  <text x="56" y="438" class="box-line muted">只进 Mihomo 或出 wan0</text>
  <text x="56" y="456" class="box-line muted">外部设备不在本仓库</text>

  <g class="flow" marker-end="url(#arrow)">
    <line x1="252" y1="192" x2="286" y2="192"/>
    <line x1="252" y1="304" x2="286" y2="304"/>
    <line x1="252" y1="416" x2="286" y2="416"/>
  </g>

  <!-- rp5 panel -->
  <rect x="292" y="112" width="700" height="704" rx="14" fill="#131815" stroke="#33403A"/>
  <text x="316" y="142" class="panel-title">rp5 主机（11 个 enabled 单元 + 系统 nftables）</text>

  <!-- dnsmasq -->
  <rect x="320" y="164" width="286" height="104" rx="9" fill="#1A211D" stroke="#3A4A40"/>
  <text x="336" y="190" class="box-title">dnsmasq（两个作用域）</text>
  <text x="336" y="212" class="box-line mono muted">127.0.0.1:53 · 192.168.20.1:53</text>
  <text x="336" y="232" class="box-line muted">resolver.conf 只服务环回</text>
  <text x="336" y="252" class="box-line muted">VLAN 实例直投 Mihomo :1053</text>

  <!-- mosdns -->
  <rect x="320" y="304" width="286" height="132" rx="9" fill="#1A211D" stroke="#3A4A40"/>
  <text x="336" y="330" class="box-title">MosDNS</text>
  <text x="336" y="352" class="box-line mono muted">127.0.0.1:5335 · API :9091</text>
  <text x="336" y="372" class="box-line muted">规则集 rules/current/ · 国内 DoH 直连</text>
  <text x="336" y="392" class="box-line mono muted">dns.alidns.com / doh.pub</text>
  <text x="336" y="412" class="box-line muted">其余域名交给 Mihomo DNS</text>
  <text x="336" y="430" class="box-line muted">DynamicUser · ProtectSystem=strict</text>

  <!-- mihomo dns -->
  <rect x="668" y="304" width="300" height="132" rx="9" fill="#1A211D" stroke="#3A4A40"/>
  <text x="684" y="330" class="box-title">Mihomo DNS</text>
  <text x="684" y="352" class="box-line mono muted">127.0.0.1:1053 · fake-IP</text>
  <text x="684" y="372" class="box-line muted">fake-ip-range 198.18.0.1/16</text>
  <text x="684" y="392" class="box-line muted">fake-ip-filter 保留真实地址</text>
  <text x="684" y="412" class="box-line muted">模式机在 mosdns / mihomo / direct 间切换</text>
  <text x="684" y="430" class="box-line muted">dnsmasq 上游由 mihomo-dns-mode 改写</text>

  <g class="flow" marker-end="url(#arrow)">
    <line x1="463" y1="268" x2="463" y2="300"/>
    <line x1="606" y1="368" x2="664" y2="368"/>
  </g>
  <text x="470" y="288" class="box-line muted">上游列表</text>
  <text x="610" y="358" class="box-line muted">未命中国内</text>

  <!-- wrapper -->
  <rect x="320" y="472" width="286" height="112" rx="9" fill="#20281F" stroke="#CBF16D"/>
  <text x="336" y="498" class="box-title">预算包装器</text>
  <text x="336" y="520" class="box-line mono muted">mihomo-measurement-budget --run-core</text>
  <text x="336" y="540" class="box-line muted">broker 常驻建 socket；--run-core 校验</text>
  <text x="336" y="560" class="box-line mono muted">/run/mihomo-measurements/budget.sock</text>
  <text x="336" y="578" class="box-line muted">账本首扣创建：quality-budget.json</text>

  <!-- mihomo core -->
  <rect x="668" y="472" width="300" height="112" rx="9" fill="#1A211D" stroke="#3A4A40"/>
  <text x="684" y="498" class="box-title">Mihomo 核心</text>
  <text x="684" y="520" class="box-line muted">v1.19.28-budget-status-contract-v3</text>
  <text x="684" y="540" class="box-line mono muted">TUN Mihomo 198.18.0.1/30</text>
  <text x="684" y="560" class="box-line mono muted">mixed 127.0.0.1:7890 · controller :9090</text>
  <text x="684" y="578" class="box-line muted">原生 url-test / fallback 负责选路</text>

  <g class="flow-accent" marker-end="url(#arrowAccent)">
    <line x1="606" y1="528" x2="664" y2="528"/>
  </g>
  <text x="612" y="518" class="box-line muted">exec</text>

  <!-- data plane -->
  <rect x="320" y="608" width="648" height="88" rx="9" fill="#161D19" stroke="#3A4A40"/>
  <text x="336" y="632" class="box-title">数据面（由内核与部署端共同维护）</text>
  <text x="336" y="654" class="box-line mono muted">inet mihomo：53 dnat → 198.18.0.2；TCP redirect → :46225；UDP 走 TUN</text>
  <text x="336" y="674" class="box-line mono muted">inet rp_filter（INPUT/FORWARD drop）· ip rp_nat 仅 include 的 NAT · ip rule 9000 → table 2022</text>
  <text x="336" y="690" class="box-line muted">内核 rp_filter sysctl = 2（loose），与同名 nft 表是两个对象</text>

  <g class="flow" marker-end="url(#arrow)">
    <line x1="818" y1="584" x2="818" y2="604"/>
  </g>
  <text x="826" y="600" class="box-line muted">流量入口</text>

  <!-- dropins -->
  <text x="320" y="726" class="box-title">mihomo.service 的 6 个 drop-in</text>
  <g>
    <rect x="320" y="740" width="204" height="30" rx="6" fill="#1A211D" stroke="#3A4A40"/>
    <text x="334" y="760" class="chip mono muted">dns-failover.conf</text>
    <rect x="540" y="740" width="204" height="30" rx="6" fill="#1A211D" stroke="#3A4A40"/>
    <text x="554" y="760" class="chip mono muted">hardening.conf</text>
    <rect x="760" y="740" width="208" height="30" rx="6" fill="#1A211D" stroke="#3A4A40"/>
    <text x="774" y="760" class="chip mono muted">measurement-budget.conf</text>

    <rect x="320" y="778" width="204" height="30" rx="6" fill="#1A211D" stroke="#3A4A40"/>
    <text x="334" y="798" class="chip mono muted">ucg-link.conf</text>
    <rect x="540" y="778" width="204" height="30" rx="6" fill="#1A211D" stroke="#3A4A40"/>
    <text x="554" y="798" class="chip mono muted">zz-alert.conf</text>
    <rect x="760" y="778" width="208" height="30" rx="6" fill="#1A211D" stroke="#3A4A40"/>
    <text x="774" y="798" class="chip mono muted">zz-startup-probe.conf</text>
  </g>

  <!-- upstream -->
  <rect x="1024" y="152" width="216" height="104" rx="10" fill="#161D19" stroke="#2C3730"/>
  <text x="1040" y="178" class="box-title">上游 · wan0（VLAN1）</text>
  <text x="1040" y="202" class="box-line mono muted">192.168.0.117/24</text>
  <text x="1040" y="222" class="box-line muted">上游网关 192.168.0.1</text>
  <text x="1040" y="242" class="box-line muted">SSH 与 8799 只信这个 /24</text>

  <g class="flow-accent" marker-end="url(#arrowAccent)">
    <path d="M 972 528 L 1000 528 L 1000 204 L 1020 204"/>
  </g>
  <text x="938" y="600" class="box-line muted">出口（interface-name: wan0）</text>

  <!-- subsystems -->
  <rect x="1024" y="300" width="216" height="132" rx="10" fill="#161D19" stroke="#2C3730"/>
  <text x="1040" y="326" class="box-title">维护面</text>
  <text x="1040" y="348" class="box-line muted">healthcheck / watch</text>
  <text x="1040" y="368" class="box-line muted">mosdns-healthcheck</text>
  <text x="1040" y="388" class="box-line muted">rules / binary update</text>
  <text x="1040" y="408" class="box-line mono muted">/run/mihomo-healthcheck/status</text>
  <text x="1040" y="424" class="box-line muted">11 个 enabled，4 个 timer 休眠</text>

  <rect x="1024" y="452" width="216" height="112" rx="10" fill="#161D19" stroke="#2C3730"/>
  <text x="1040" y="478" class="box-title">不在本仓库交付</text>
  <text x="1040" y="500" class="box-line muted">Landscape Router</text>
  <text x="1040" y="520" class="box-line muted">容器控制面 / 特权容器</text>
  <text x="1040" y="540" class="box-line muted">订阅、节点、密钥、备份</text>
  <text x="1040" y="560" class="box-line muted">研究见 docs/research/</text>

  <text x="48" y="858" class="foot muted">三层 DNS：dnsmasq（入口）→ MosDNS（国内直连 DoH、其余转发）→ Mihomo fake-IP（代理域名）。</text>
  <text x="48" y="880" class="foot muted">地址与端口来自 2026-10-25 只读快照；节点、订阅、密钥与真实 MAC 不进入发布物。</text>
</svg>
