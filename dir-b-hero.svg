<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
  <title>线路图：四道断点</title>
  <desc>工程图纸风格：一条线路串起四道可断开关，下方是失败回退支路。</desc>
  <rect width="1200" height="560" fill="#E9EBE7"/>
  <text x="64" y="64" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="19" fill="#5E665C">rpi5-mihomo-gateway</text>
  <text x="64" y="164" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="48" font-weight="600" fill="#171A16">四道断点，一道回退</text>
  <text x="64" y="208" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="21" fill="#5E665C">启动、浸泡、运行、回退各有一票否决。</text>
  <line x1="64" y1="240" x2="520" y2="240" stroke="#171A16" stroke-width="2"/>
  <text x="64" y="300" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="20" fill="#171A16">判据只看内核：设备、两张 nft 表、规则 9000。</text>
  <text x="64" y="336" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="20" fill="#171A16">候选内核先跑 45 秒，再读一次连接表。</text>
  <text x="64" y="372" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="20" fill="#171A16">任何一项失败，回到上一颗内核并复验。</text>
  <line x1="600" y1="300" x2="1150" y2="300" stroke="#171A16" stroke-width="2"/>
  <circle cx="640" cy="300" r="4.5" fill="#E9EBE7" stroke="#171A16" stroke-width="2"/>
  <line x1="644" y1="296" x2="684" y2="262" stroke="#171A16" stroke-width="2"/>
  <circle cx="684" cy="262" r="4.5" fill="#E9EBE7" stroke="#171A16" stroke-width="2"/>
  <circle cx="684" cy="300" r="4.5" fill="#E9EBE7" stroke="#171A16" stroke-width="2"/>
  <text x="674" y="344" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#171A16">单元门禁</text>
  <text x="674" y="368" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="13.5" fill="#5E665C">TUN nft rule</text>
  <circle cx="770" cy="300" r="4.5" fill="#E9EBE7" stroke="#171A16" stroke-width="2"/>
  <line x1="774" y1="296" x2="814" y2="262" stroke="#171A16" stroke-width="2"/>
  <circle cx="814" cy="262" r="4.5" fill="#E9EBE7" stroke="#171A16" stroke-width="2"/>
  <circle cx="814" cy="300" r="4.5" fill="#E9EBE7" stroke="#171A16" stroke-width="2"/>
  <text x="804" y="344" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#171A16">部署门禁</text>
  <text x="804" y="368" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="13.5" fill="#5E665C">45s + conns</text>
  <circle cx="900" cy="300" r="4.5" fill="#E9EBE7" stroke="#171A16" stroke-width="2"/>
  <line x1="904" y1="296" x2="944" y2="262" stroke="#171A16" stroke-width="2"/>
  <circle cx="944" cy="262" r="4.5" fill="#E9EBE7" stroke="#171A16" stroke-width="2"/>
  <circle cx="944" cy="300" r="4.5" fill="#E9EBE7" stroke="#171A16" stroke-width="2"/>
  <text x="934" y="344" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#171A16">常态观测</text>
  <text x="934" y="368" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="13.5" fill="#5E665C">60s / 300s</text>
  <circle cx="1030" cy="300" r="4.5" fill="#E9EBE7" stroke="#171A16" stroke-width="2"/>
  <line x1="1034" y1="296" x2="1074" y2="262" stroke="#171A16" stroke-width="2"/>
  <circle cx="1074" cy="262" r="4.5" fill="#E9EBE7" stroke="#171A16" stroke-width="2"/>
  <circle cx="1074" cy="300" r="4.5" fill="#E9EBE7" stroke="#171A16" stroke-width="2"/>
  <text x="1064" y="344" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#171A16">换核回滚</text>
  <text x="1064" y="368" text-anchor="middle" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="13.5" fill="#5E665C">renameat2</text>
  <line x1="880" y1="300" x2="880" y2="420" stroke="#A93B1C" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="880" y1="420" x2="700" y2="420" stroke="#A93B1C" stroke-width="2"/>
  <path d="M700 420 l14 -7 l0 14 z" fill="#A93B1C"/>
  <rect x="548" y="398" width="140" height="44" fill="none" stroke="#A93B1C" stroke-width="2"/>
  <text x="570" y="428" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#A93B1C">回退并复验</text>
  <text x="640" y="500" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="17" fill="#5E665C">任一道断开 → 换回上一颗内核，再验一次</text>
</svg>
