<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
  <title>仪表盘：状态即断言</title>
  <desc>深色仪表盘，左侧标题与一句解释，右侧是四项真实状态与转发计数。</desc>
  <rect width="1200" height="560" fill="#0F1311"/>
  <rect x="0.5" y="0.5" width="1199" height="559" fill="none" stroke="#242C26"/>
  <text x="64" y="92" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="20" fill="#8B9A8D">rpi5-mihomo-gateway / Raspberry Pi 5</text>
  <text x="64" y="172" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="56" font-weight="600" fill="#EEF2EC">一个会自证的网关</text>
  <text x="64" y="238" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="24" fill="#A7B3A7">四件事同时成立，才算上线成功。</text>
  <text x="64" y="274" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="24" fill="#A7B3A7">失败自动换回上一颗内核，并推送原因。</text>
  <text x="64" y="420" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="19" fill="#7C8B7F">10-25 换核漏编 gVisor：7 分钟无告警。</text>
  <text x="64" y="450" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="19" fill="#7C8B7F">当时的巡检只判进程存活。</text>
  <rect x="648" y="64" width="488" height="432" fill="#151A17" stroke="#2A332B"/>
  <text x="676" y="116" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="20" fill="#93A293">当前状态</text>
  <text x="676" y="180" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="46" font-weight="600" fill="#CBF16D">已验证</text>
  <text x="872" y="180" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="19" fill="#8FA38F">verified</text>
  <rect x="676" y="227" width="10" height="10" fill="#CBF16D"/>
  <text x="702" y="238" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="21" fill="#E3EAE1">TUN</text>
  <text x="1110" y="238" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="21" fill="#93A293" text-anchor="end">Mihomo / up</text>
  <rect x="676" y="273" width="10" height="10" fill="#CBF16D"/>
  <text x="702" y="284" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="21" fill="#E3EAE1">nft</text>
  <text x="1110" y="284" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="21" fill="#93A293" text-anchor="end">mihomo + rp_filter</text>
  <rect x="676" y="319" width="10" height="10" fill="#CBF16D"/>
  <text x="702" y="330" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="21" fill="#E3EAE1">rule</text>
  <text x="1110" y="330" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="21" fill="#93A293" text-anchor="end">9000 → 2022 / ok</text>
  <rect x="676" y="365" width="10" height="10" fill="#CBF16D"/>
  <text x="702" y="376" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="21" fill="#E3EAE1">egress</text>
  <text x="1110" y="376" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="21" fill="#93A293" text-anchor="end">204 gstatic / ok</text>
  <text x="676" y="472" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="18" fill="#7C8B7F">packets 45594 / conns 93 / 02:14</text>
</svg>
