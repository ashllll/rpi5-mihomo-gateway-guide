<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
  <title>记录：一次事故与现在的四道门</title>
  <desc>白纸表格风格：左侧是 2026-10-25 事故时间线，右侧是现在上线要过的四道门。</desc>
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="64" y="72" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="19" fill="#7A7A6E">2026-10-25 01:28 — 02:15</text>
  <text x="64" y="142" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="46" font-weight="600" fill="#14150F">先证明它通，再让它接管</text>
  <line x1="64" y1="176" x2="1136" y2="176" stroke="#14150F" stroke-width="1.5"/>
  <text x="64" y="216" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="17" fill="#7A7A6E">事故</text>
  <text x="820" y="216" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="17" fill="#7A7A6E">现在</text>
  <text x="64" y="262" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="18" fill="#7A7A6E">01:28</text>
  <text x="150" y="262" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#14150F">部署新内核，校验只跑了 mihomo -t</text>
  <text x="64" y="306" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="18" fill="#7A7A6E">01:29</text>
  <text x="150" y="306" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#14150F">TUN 未建立（内核漏编 with_gvisor），客户端流量归零</text>
  <text x="64" y="350" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="18" fill="#7A7A6E">01:29</text>
  <text x="150" y="350" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#14150F">健康检查仍报进程存活，没有任何告警</text>
  <text x="64" y="394" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="18" fill="#7A7A6E">01:35</text>
  <text x="150" y="394" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#14150F">改回 system 栈重启，TUN 恢复，代理流量回来</text>
  <text x="64" y="438" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="18" fill="#7A7A6E">02:15</text>
  <text x="150" y="438" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#14150F">负向演练：写坏 tun.device → 回滚并复验通过</text>
  <rect x="820" y="246" width="9" height="9" fill="#1F6B4F"/>
  <text x="844" y="258" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#14150F">单元门禁</text>
  <text x="844" y="280" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="15.5" fill="#7A7A6E">TUN / nft / rule</text>
  <rect x="820" y="302" width="9" height="9" fill="#1F6B4F"/>
  <text x="844" y="314" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#14150F">部署门禁</text>
  <text x="844" y="336" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="15.5" fill="#7A7A6E">45s 浸泡 + 连接表</text>
  <rect x="820" y="358" width="9" height="9" fill="#1F6B4F"/>
  <text x="844" y="370" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#14150F">常态观测</text>
  <text x="844" y="392" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="15.5" fill="#7A7A6E">60s 状态 / 300s 出口</text>
  <rect x="820" y="414" width="9" height="9" fill="#1F6B4F"/>
  <text x="844" y="426" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans SC','Source Han Sans SC',system-ui,sans-serif" font-size="19" fill="#14150F">换核回滚</text>
  <text x="844" y="448" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="15.5" fill="#7A7A6E">双槽 + 复验</text>
  <line x1="64" y1="474" x2="1136" y2="474" stroke="#DCDCD2" stroke-width="1"/>
  <text x="64" y="510" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="17" fill="#7A7A6E">证据：journal、nft 计数、/run/mihomo-healthcheck/status</text>
  <text x="820" y="510" font-family="'SFMono-Regular',ui-monospace,'SF Mono',Menlo,monospace" font-size="17" fill="#7A7A6E">任一失败即回退，不带着坏部署过夜</text>
</svg>
