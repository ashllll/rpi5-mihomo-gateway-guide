[Service]
# Debian's vendor unit ends nftables.service with `nft flush ruleset`, which
# removes every table, including the runtime-owned `inet mihomo` and
# `inet dns_bypass` tables.  Stop nftables must remove only the two static
# tables this repository manages; the first empty assignment resets the
# vendor ExecStop list before the two destroys are appended.  F-20/DR-04.
ExecStop=
ExecStop=/usr/sbin/nft destroy table inet rp_filter
ExecStop=/usr/sbin/nft destroy table ip rp_nat
