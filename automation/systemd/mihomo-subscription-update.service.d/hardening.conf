[Service]
# The updater must write only its configuration and rollback locations.
ProtectSystem=full
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectHostname=true
ProtectClock=true
ProtectKernelLogs=true
ProtectKernelTunables=true
RestrictNamespaces=true
RestrictSUIDSGID=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
ReadWritePaths=/etc/mihomo /var/lib/mihomo-subscription-backups /var/lib/mihomo-extra-subscriptions /var/tmp
