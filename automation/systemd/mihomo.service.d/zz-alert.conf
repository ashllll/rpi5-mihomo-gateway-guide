[Unit]
# A gateway that cannot route must report itself, not stay green. OnFailure
# covers start-limit exhaustion and any failed ExecStartPre/ExecStartPost, so the
# startup gate reaches the phone even when nobody is watching the journal.
OnFailure=mihomo-alert@%N.service
# Retries are bounded: a core that cannot pass the gate may be restarted twice,
# then the unit fails and the failure alert fires.
StartLimitIntervalSec=600
StartLimitBurst=3
