[Service]
# Startup evidence gate. `mihomo -t` cannot prove the TUN device or its nftables
# hooks exist, and on 2026-10-25 a core built without gVisor passed `-t`, stayed
# up, and black-holed every proxied connection. This probe only reads kernel
# state and fails the unit when the hooks are missing: a gateway that cannot
# route must be red, not silently idle. The timer and rp5-agent also surface it.
# Drop-in ordering matters: dns-failover.conf resets ExecStartPost, so this file
# sorts after it.
EnvironmentFile=-/etc/mihomo-automation.env
ExecStartPost=/usr/local/sbin/mihomo-healthcheck --startup-check 20
