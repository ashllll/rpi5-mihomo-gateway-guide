[Service]
# Startup evidence gate. `mihomo -t` cannot prove the TUN device, its nftables
# hooks or that traffic actually leaves, and on 2026-10-25 a core built without
# gVisor passed `-t`, stayed up, and black-holed every proxied connection. This
# probe waits for the TUN device, the redirect rule and the routing rule, then
# fetches one page through the proxy; the unit fails when any of them is missing
# or the fetch does not come back. The timer and rp5-agent surface the same: a
# gateway that cannot route must be red, not silently idle.
# Drop-in ordering matters: dns-failover.conf resets ExecStartPost, so this file
# sorts after it.
ExecStartPost=/usr/local/sbin/mihomo-healthcheck --startup-check 20
