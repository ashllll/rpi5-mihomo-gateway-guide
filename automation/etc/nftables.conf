
# Installed to /etc/nftables.conf by automation/install.sh (install_default:
# an existing file is kept, so local edits on the gateway win).  Every address
# below is an RFC 5737 documentation placeholder; the recorded gateway uses its
# real private ranges instead.
#
# Idempotently replace only the tables owned by this file.  Do not flush the
# global ruleset: Mihomo owns a separate dynamic table at runtime.
destroy table inet rp_filter
destroy table ip rp_nat

table inet rp_filter {
	chain input {
		type filter hook input priority filter; policy drop;

		iifname "lo" accept
		ct state invalid drop
		ct state established,related accept

		# Allow password SSH from the current upstream private LAN.
		iifname { "wan0", "wlan0" } ip saddr 198.51.100.0/24 tcp dport 22 accept

		# Read-only status endpoint for the T-Display-S3 monitor.
		iifname { "wan0", "wlan0" } ip saddr 198.51.100.0/24 tcp dport 8799 accept

		# NetworkManager DHCP clients on the upstream interfaces.
		iifname { "wan0", "wlan0" } udp sport 67 udp dport 68 accept
		iifname { "wan0", "wlan0" } udp sport 547 udp dport 546 accept

		# IPv4 diagnostics and IPv6 neighbour discovery/router advertisements.
		ip protocol icmp accept
		meta l4proto ipv6-icmp accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;

		ct state invalid drop
		ct state established,related accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

table ip rp_nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		# No LAN masquerade: every downstream client is proxied through the TUN,
		# and the upstream LAN already has the UCG as its NAT gateway.
	}
}

# PC-only UCG WireGuard link.
include "/etc/nftables.d/ucg-pc-link.nft"

# PC VLAN pilot
include "/etc/nftables.d/vlan-pilot.nft"
