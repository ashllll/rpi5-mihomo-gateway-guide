# Local resolver only.
#
# The isolated downstream LAN and the Pi's own access point were retired: the
# gateway is a single cable into the UCG switch, VLAN20 Wi-Fi clients are served
# by dnsmasq-vlan-pilot.conf, and the upstream LAN has its own DNS.  dnsmasq
# stays installed for one job: answering 127.0.0.1:53 for the gateway's own
# tools and health checks, with the same upstreams file mihomo-dns-mode swaps.
interface=lo
listen-address=127.0.0.1
bind-dynamic

domain-needed
bogus-priv
stop-dns-rebind
no-resolv
# Exactly one DNS mode is active at a time.  mihomo-dns-mode rewrites this file
# atomically and dnsmasq re-reads it on SIGHUP.
servers-file=/etc/dnsmasq-upstreams.conf
cache-size=1000

# Names for the gateway itself (host-record beats /etc/hosts 127.0.1.1).
host-record=gateway,198.51.100.117
host-record=gateway.localdomain,198.51.100.117
host-record=gateway.lan,198.51.100.117
