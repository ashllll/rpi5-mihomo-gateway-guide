# Serve only the isolated downstream LAN and local loopback.
interface=lan0
listen-address=127.0.0.1,192.0.2.1
bind-dynamic

# IPv4-only LAN during the first deployment phase.
no-dhcpv6-interface=lan0
dhcp-authoritative
dhcp-range=192.0.2.100,192.0.2.199,255.255.255.0,12h
dhcp-option=option:router,192.0.2.1
dhcp-option=option:dns-server,192.0.2.1
dhcp-option=option:netmask,255.255.255.0
dhcp-lease-max=100

# Local names and a small cache. Upstream DNS is explicitly pinned to WAN.
domain=lan
local=/lan/
expand-hosts
domain-needed
bogus-priv
stop-dns-rebind
no-resolv
# Keep exactly one DNS mode active. The servers file is switched atomically
# by mihomo-dns-mode and is re-read by dnsmasq on SIGHUP.
servers-file=/etc/dnsmasq-upstreams.conf
cache-size=1000

# DHCP events are useful during staged rollout; per-query logging stays off.
log-dhcp

# LAN name for the gateway itself (host-record beats /etc/hosts 127.0.1.1)
host-record=gateway,192.0.2.117
host-record=gateway.localdomain,192.0.2.117
host-record=gateway.lan,192.0.2.117
