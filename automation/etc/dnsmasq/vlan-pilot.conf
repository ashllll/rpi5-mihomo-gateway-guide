# PC-only VLAN pilot: its own DHCP scope, DNS straight to the Mihomo DNS port
# (1053, fake-ip) so this segment never sees the domestic resolver. Installed as
# /etc/dnsmasq-vlan-pilot.conf and run by dnsmasq-vlan-pilot.service. Every
# address is a documentation placeholder and the lease is pinned to the RFC 7042
# documentation MAC (dnsmasq takes either colon or dash notation).
interface=proxy20
except-interface=lo
listen-address=198.51.100.1
bind-dynamic
no-dhcpv6-interface=proxy20
dhcp-authoritative
dhcp-range=198.51.100.100,198.51.100.199,255.255.255.0,10m
dhcp-host=00-00-5e-00-53-01,set:pc,198.51.100.10,10m
dhcp-option=option:router,198.51.100.1
dhcp-option=option:dns-server,198.51.100.1
dhcp-option=option:netmask,255.255.255.0
dhcp-leasefile=/run/dnsmasq-vlan-pilot/leases
no-resolv
server=127.0.0.1#1053
cache-size=0
domain-needed
bogus-priv
log-dhcp

host-record=gateway,192.0.2.117
host-record=gateway.localdomain,192.0.2.117
host-record=gateway.lan,192.0.2.117
