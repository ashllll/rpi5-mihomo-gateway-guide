# Upstream dnsmasq forwards to, as the recorded gateway runs it: mosdns owns
# :5335 and decides per name between domestic DoH and the Mihomo fake-ip port.
# /etc/dnsmasq.d/lan.conf points servers-file at this path; mihomo-dns-mode
# swaps the file between the per-mode baselines in /etc/mihomo/ without any
# dnsmasq unit change. install.sh seeds this file only when none exists, so a
# first boot has working DNS before the proxy stack is up.
server=127.0.0.1#5335@lo
