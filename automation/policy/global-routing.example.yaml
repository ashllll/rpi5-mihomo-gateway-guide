media_admission:
  enabled: false
selections:
  GLaDOS AI Pool:
    type: fallback
    patterns:
    - ^JP-Fixed
    - ^US-Fixed
  GitHub API:
    type: select
    patterns:
    - '^BWB \| '
    - '^STT \| '
    - '^ByWave \| '
stability:
  groups:
    GitHub Download:
      url: https://github.com/robots.txt
      expected-status: 200
