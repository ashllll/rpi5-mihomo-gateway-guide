# Reviewed public policy sections from the deployed gateway.
# Merge into the private manifest; retain account budgets and node-pool patterns.
roles:
  bulk_download:
    stt_prefix: 'STT | '
    bywave_prefix: 'BWB | '
    glados_patterns: []
    glados_exclude_patterns:
    - (?i)(^|[- _|])X[0-9]
    - (?i)NF
    - (?i)Netflix
    glados_explicit_allow: []
    stt_only: false
