version: 1
# Activation and account budgets are deployment decisions. Missing/false keeps
# all generated native URL checks paused.
measurement:
  enabled: false
  # Native URLTests require the pinned patched core and local admission service.
  native_budget: true
  # Detection latency of the shared native URLTest providers; this is
  # what actually decides how fast a dead node leaves a group.
  native_interval_seconds: 250
  accounts: {}
  # Account IDs must be non-empty strings; quote numeric IDs, e.g. "12345".
  # Each account uses positive prefixes/names, native_probes_per_hour (planned
  # periodic checks) and quality_attempts_per_hour (the shared HTTP-attempt
  # budget for every native URLTest, including startup, failure, refresh and
  # rollback checks). The existing quality_attempts_per_hour key is retained
  # for the persisted account ledger contract.
# Optional private download_routes/video_routes entries override the
# separately installed route-defaults.yaml by route ID. Missing, null or empty
# tables inherit defaults; explicit route entries must contain domains.
stability:
  # Detection ceiling applied by mihomo-policy-overlay to every
  # generated group: a dead node can never pin traffic past this.
  max_interval: 250
  groups:
    Research + AI:
      url: https://api.openai.com/v1/models
      expected-status: 401
      timeout: 5000
      max-failed-times: 2
    Streaming:
      url: https://www.youtube.com/generate_204
      expected-status: 204
      timeout: 5000
      max-failed-times: 2
    Social:
      url: https://api.x.com/2/users/me
      # Native fallback checks transport only; the shell diagnoses X paths.
      expected-status: 200-499
      timeout: 5000
      max-failed-times: 2
    Telegram:
      timeout: 5000
      max-failed-times: 2
    Auto:
      timeout: 5000
      max-failed-times: 2
    Download:
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      timeout: 5000
      max-failed-times: 2
    GitHub Download:
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      timeout: 5000
      max-failed-times: 2
    Model Download:
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      timeout: 5000
      max-failed-times: 2
    Package Download:
      url: https://www.gstatic.com/generate_204
      expected-status: 204
      timeout: 5000
      max-failed-times: 2
    GitHub Control:
      url: https://github.com/robots.txt
      expected-status: 200
      timeout: 5000
      max-failed-times: 2
  telegram_cidrs:
  - 91.108.56.0/22
  - 91.108.4.0/22
  - 91.108.8.0/22
  - 91.108.16.0/22
  - 91.108.12.0/22
  - 149.154.160.0/20
  - 91.105.192.0/23
  - 91.108.20.0/22
  - 185.76.151.0/24
  - 2001:b28:f23d::/48
  - 2001:b28:f23f::/48
  - 2001:67c:4e8::/48
  - 2001:b28:f23c::/48
  - 2a0a:f280::/32

# This file is policy data, not a subscription.  Subscription updates keep
# the original source rules; the local overlay reads this manifest to decide
# which nodes are eligible for sustained downloads.
roles:
  bulk_download:
    stt_prefix: "STT | "
    bywave_prefix: "ByWave | "
    # Only explicit GLaDOS download/no-limit labels are admitted.  Ordinary
    # AI, fixed-IP, NF and X-series nodes remain outside bulk pools.
    glados_patterns:
      - '(?i)(^|[- _|])D1([-. _|]|$)'
      - '(?i)(^|[- _|])D2([-. _|]|$)'
      - '(?i)(^|[- _|])download([-. _|]|$)'
      - '(?i)(^|[- _|])no[- _]?limit([-. _|]|$)'
    glados_exclude_patterns:
      - '(?i)(^|[- _|])X[0-9]'
      - '(?i)NF'
      - '(?i)Netflix'
    # Add exact names here only after confirming their capability in the
    # provider console.  This keeps renamed dedicated nodes data-driven.
    glados_explicit_allow: []

# ---------------------------------------------------------------------------
# Curated-pool preferences used by mihomo-policy-overlay.  Node labels are
# subscription data: they belong to the local deployment manifest and are never
# committed to this repository.  Fill in the labels your own subscription
# publishes; empty lists are valid here and leave the curated pool empty, which
# makes the overlay refuse to write a config instead of publishing a group with
# no usable members.
# ---------------------------------------------------------------------------
overlay:
  media_nodes: []
  ai_nodes: []
  auto_nodes: []
  developer_nodes: []
  tw_fixed_nodes: []
