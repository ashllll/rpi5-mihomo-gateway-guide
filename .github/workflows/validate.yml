name: Validate documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure PyYAML is available for the automation checks
        # The published policy scripts import yaml, so the checks need it too.
        run: python3 -c "import yaml" || python3 -m pip install --quiet --break-system-packages pyyaml

      - name: Validate publication files, renderer, overlay and automation layer
        run: |
          python3 tools/validate_public.py
          python3 tools/check_render.py
          python3 tools/check_overlay.py
          python3 tools/check_subscription_candidate.py
          python3 tools/check_subscription_update.py
          python3 tools/check_automation.py
          python3 tools/check_update_rules.py
          python3 tools/check_publication_privacy.py
          python3 tools/check_image.py
