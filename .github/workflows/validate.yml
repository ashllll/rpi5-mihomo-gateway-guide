name: Validate documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gate dependencies (fail loudly, never skip)
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml
          if ! command -v dig >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dnsutils
          fi

      - name: Full gate (scripts/preflight.sh, the same entry as local)
        run: ./scripts/preflight.sh

  core-build:
    # The shipped core must be built with the gVisor graph driver: a core without
    # it passes `mihomo -t`, then starts with no TUN device and drops every
    # proxied connection (2026-10-25 incident). Build the pinned patch and prove
    # the capability from the binary itself.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure PyYAML is available for the core profile
        run: python3 -c "import yaml" || python3 -m pip install --quiet --break-system-packages pyyaml

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false

      - name: Build the pinned core and run the core profile
        run: |
          set -eu
          commit=$(python3 -c "import json;print(json.load(open('core/upstream.json'))['commit'])")
          git clone --filter=blob:none --no-checkout https://github.com/MetaCubeX/mihomo.git src
          git -C src checkout --quiet "$commit"
          test "$(git -C src rev-parse HEAD)" = "$commit"
          git -C src apply "$GITHUB_WORKSPACE/core/mihomo-v1.19.28-budget.patch"
          cd src
          go build -trimpath -tags "with_gvisor no_tailscale" \
            -ldflags "-X github.com/metacubex/mihomo/constant.Version=v1.19.28-budget-status-contract-v3" \
            -o "$RUNNER_TEMP/core-host" .
          "$RUNNER_TEMP/core-host" -v | grep -q with_gvisor
          "$RUNNER_TEMP/core-host" -v | grep -q 'v1.19.28-budget-status-contract-v3'
          test "$("$RUNNER_TEMP/core-host" -measurement-budget-protocol)" = mihomo-budget-v1
          (cd "$GITHUB_WORKSPACE" && MIHOMO_TEST_BINARY="$RUNNER_TEMP/core-host" ./scripts/preflight.sh --profile core)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -tags "with_gvisor no_tailscale" \
            -ldflags "-X github.com/metacubex/mihomo/constant.Version=v1.19.28-budget-status-contract-v3" \
            -o "$RUNNER_TEMP/core-arm64" .

  core-build-arm64:
    # Arm64 acceptance: core-build above only cross-compiles the arm64 artifact
    # and never runs it. This job builds it natively on an arm64 runner and
    # proves the same version, gVisor tags and budget protocol from execution.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure PyYAML is available for the core profile
        run: python3 -c "import yaml" || python3 -m pip install --quiet --break-system-packages pyyaml

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false

      - name: Build the pinned core natively and run the core profile
        run: |
          set -eu
          commit=$(python3 -c "import json;print(json.load(open('core/upstream.json'))['commit'])")
          git clone --filter=blob:none --no-checkout https://github.com/MetaCubeX/mihomo.git src
          git -C src checkout --quiet "$commit"
          test "$(git -C src rev-parse HEAD)" = "$commit"
          git -C src apply "$GITHUB_WORKSPACE/core/mihomo-v1.19.28-budget.patch"
          cd src
          CGO_ENABLED=0 go build -trimpath -tags "with_gvisor no_tailscale" \
            -ldflags "-X github.com/metacubex/mihomo/constant.Version=v1.19.28-budget-status-contract-v3" \
            -o "$RUNNER_TEMP/core-arm64" .
          "$RUNNER_TEMP/core-arm64" -v | tee "$RUNNER_TEMP/version.txt"
          grep -q 'linux arm64' "$RUNNER_TEMP/version.txt"
          grep -q with_gvisor "$RUNNER_TEMP/version.txt"
          test "$("$RUNNER_TEMP/core-arm64" -measurement-budget-protocol)" = mihomo-budget-v1
          sha256sum "$RUNNER_TEMP/core-arm64"
          stat -c '%s bytes' "$RUNNER_TEMP/core-arm64"
          (cd "$GITHUB_WORKSPACE" && MIHOMO_TEST_BINARY="$RUNNER_TEMP/core-arm64" ./scripts/preflight.sh --profile core)
