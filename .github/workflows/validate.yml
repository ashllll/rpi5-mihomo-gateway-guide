name: Validate documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure PyYAML is available for the automation checks
        # The published policy scripts import yaml, so the checks need it too.
        run: python3 -c "import yaml" || python3 -m pip install --quiet --break-system-packages pyyaml

      - name: Validate publication files, overlay and automation layer
        run: |
          python3 automation/check-release.py
          python3 tools/check_release_integrity.py
          python3 tools/check_update_transaction.py
          python3 tools/check_client_dns_guard.py
          python3 tools/check_scoped_probes.py
          python3 tools/check_reconcile_policy.py
          python3 tools/validate_public.py
          python3 tools/check_overlay.py
          python3 tools/check_mihomo_policy.py
          python3 tools/check_subscription_candidate.py
          python3 tools/check_legacy_stt.py
          python3 tools/check_subscription_normalize.py
          python3 tools/check_subscription_update.py
          python3 tools/check_automation.py
          python3 tools/check_stability.py
          python3 tools/check_gateway_resilience.py
          python3 tools/check_dns_resilience.py
          python3 tools/check_alert_delivery.py
          python3 tools/check_rollback_recovery.py
          python3 tools/check_dnsmasq_guard.py
          python3 tools/check_measurement_policy.py
          python3 tools/check_native_budget.py
          python3 tools/check_media_policy.py
          python3 tools/check_media_guard.py
          python3 tools/check_update_rules.py
          python3 tools/check_publication_privacy.py
          python3 tools/check_image.py

  core-build:
    # The shipped core must be built with the gVisor graph driver: a core without
    # it passes `mihomo -t`, then starts with no TUN device and drops every
    # proxied connection (2026-10-25 incident). Build the pinned patch and prove
    # the capability from the binary itself.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: false

      - name: Build the pinned core and verify its graph driver
        run: |
          set -eu
          commit=$(python3 -c "import json;print(json.load(open('core/upstream.json'))['commit'])")
          git clone --filter=blob:none --no-checkout https://github.com/MetaCubeX/mihomo.git src
          git -C src checkout --quiet "$commit"
          test "$(git -C src rev-parse HEAD)" = "$commit"
          git -C src apply "$GITHUB_WORKSPACE/core/mihomo-v1.19.28-budget.patch"
          cd src
          go build -trimpath -tags "with_gvisor no_tailscale" \
            -ldflags "-X github.com/metacubex/mihomo/constant.Version=v1.19.28-budget-status-contract-v3" \
            -o "$RUNNER_TEMP/core-host" .
          "$RUNNER_TEMP/core-host" -v | grep -q with_gvisor
          "$RUNNER_TEMP/core-host" -v | grep -q 'v1.19.28-budget-status-contract-v3'
          test "$("$RUNNER_TEMP/core-host" -measurement-budget-protocol)" = mihomo-budget-v1
          (cd "$GITHUB_WORKSPACE" && MIHOMO_TEST_BINARY="$RUNNER_TEMP/core-host" python3 tools/check_legacy_stt.py)
          (cd "$GITHUB_WORKSPACE" && MIHOMO_TEST_BINARY="$RUNNER_TEMP/core-host" python3 tools/check_media_core.py)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -tags "with_gvisor no_tailscale" \
            -ldflags "-X github.com/metacubex/mihomo/constant.Version=v1.19.28-budget-status-contract-v3" \
            -o "$RUNNER_TEMP/core-arm64" .
